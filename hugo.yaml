  experience:
    enable: true
    items:
      - company: "James Cook University"
        companyUrl: "https://vertecolab.weebly.com/"
        jobs:
          - name: "Postdoctoral Research Fellow"
            date: "2025 - present"
            content: |
              - Leading multiple large-scale ecoacoustic monitoring projects across Australia focusing on reliable detection
              of threatened and introduced species, revealing diel and seasonal activity patterns, and assessing the impact
              of solar farms and urbanisation on vertebrates.
              - Developing and evaluating effective custom species call recognisers for mammals, frogs, reptiles, and birds.
              - Designing and delivering comprehensive workshops to build capacity in passive acoustic monitoring with indigenous rangers,
              government and private sector stakeholders.
              - Collaborating with Indigenous ranger groups to develop and implement large-scale, long-term acoustic monitoring projects
              that support looking after Country.


